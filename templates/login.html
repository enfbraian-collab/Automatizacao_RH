<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Portal de Contratos</title><style>body{font-family:system-ui;background:#f2f5fa;display:grid;place-items:center;height:100vh;margin:0}.card{background:white;padding:36px;border-radius:16px;box-shadow:0 8px 30px #142e4b18;width:min(360px,85vw)}input,button{box-sizing:border-box;width:100%;padding:12px;margin:9px 0;border-radius:8px;border:1px solid #cbd5e1}button{background:#1253a0;color:white;border:0;cursor:pointer}.error{color:#b42318}</style></head><body><form class="card" method="post"><h2>Portal de Contratos</h2><p>Acesso restrito</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<input name="username" placeholder="Usuário" required autocomplete="username"><input name="password" type="password" placeholder="Senha" required autocomplete="current-password"><button>Entrar</button></form></body></html>
