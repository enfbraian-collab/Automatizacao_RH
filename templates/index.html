<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal RH | Contratos Determinados</title><style>
*{box-sizing:border-box}html{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#142c48}body{margin:0;background:#f3f6fb;line-height:1.55}a{color:#17549c}a:hover{text-decoration:underline}button,input,select{font:inherit}button,.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:10px;padding:10px 17px;background:#15559d;color:#fff;font-weight:650;text-decoration:none;cursor:pointer}button:hover,.btn:hover{background:#0d427e;color:#fff;text-decoration:none}.secondary{background:#eaf2fc;color:#164f91}.secondary:hover{background:#dceafb;color:#103f77}.danger{background:#fff0f0;color:#a11b27;border-color:#ffd0d0}.danger:hover{background:#ffe0e0;color:#8b1720}.logout{background:#f0f3f7;color:#33465c;border-color:#dce4ed}.logout:hover{background:#e1e8f1;color:#22374c}.icon{width:19px;height:19px;flex:none;vertical-align:middle}.icon-lg{width:32px;height:32px;color:#15559d}.topbar{background:#fff;border-bottom:1px solid #dce5f0;padding:16px max(20px,calc((100vw - 1140px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;font-size:20px;color:#143e70}.brand small{display:block;font-size:12px;font-weight:450;color:#61748c}.top-actions,.actions,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top-actions form{margin:0}.container{max-width:1140px;margin:36px auto;padding:0 20px}.panel,.card{background:#fff;border:1px solid #dfe7f0;border-radius:16px;padding:28px;box-shadow:0 8px 28px #142e4b09}.card{margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.module-card{display:flex;flex-direction:column;align-items:flex-start;gap:12px}.module-card p{flex:1}.module-card .icon{width:32px;height:32px;color:#15559d}h1{font-size:clamp(24px,3vw,30px);line-height:1.25;margin:0 0 10px}h2{font-size:20px;margin:0 0 18px}h3{font-size:17px;margin:18px 0 8px}p{color:#61748c;margin:7px 0 18px}label{font-size:14px;font-weight:650;display:block;margin:0 0 7px}input[type=text],input[type=password],input[type=date],select{width:100%;min-height:44px;padding:10px 12px;border:1px solid #bdccdd;border-radius:9px;background:#fff;color:#142c48}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #86b7f5;outline-offset:2px}.field{min-width:0}.field-help{font-size:12px;color:#61748c}.permissions{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0}.check{display:inline-flex;align-items:center;gap:9px;font-weight:450;cursor:pointer}.check input{width:18px;height:18px;accent-color:#15559d}.flash,.message{border-radius:10px;padding:12px 15px;background:#eaf2fc;color:#164f91;margin:16px 0}.flash.erro,.message.error{background:#fff0f0;color:#9d1b25}.flash.sucesso{background:#e7f7ee;color:#166534}.scroll{overflow:auto;max-height:470px;margin-top:18px;border:1px solid #e1e7ef;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e4eaf1;padding:11px 12px;text-align:left;white-space:nowrap}th{background:#f4f7fb;position:sticky;top:0;font-weight:750}tr:hover td{background:#f8fbff}.user{border:1px solid #dfe7f0;border-radius:12px;padding:20px;margin:16px 0}.userhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{font-size:12px;padding:5px 10px;border-radius:20px;background:#dcfce7;color:#166534}.badge.inactive{background:#fee2e2;color:#991b1b}.muted{color:#61748c;font-size:13px}.small{font-size:12px}hr{border:0;border-top:1px solid #e2e8f0;margin:22px 0}.management{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:22px}.skip{position:absolute;left:-9999px;top:0;background:#fff;padding:12px;z-index:99}.skip:focus{left:12px}.empty{padding:20px;text-align:center;color:#61748c}.status-line{min-height:24px}@media(max-width:680px){.grid,.module-grid{grid-template-columns:1fr}.topbar,.management,.userhead{align-items:flex-start;flex-wrap:wrap}.container{margin:22px auto;padding:0 12px}.panel,.card{padding:20px}.topbar{padding:14px 16px}.actions button{flex:1}.module-card p{flex:auto}}
</style></head><body><svg xmlns="http://www.w3.org/2000/svg" style="display:none"><symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></symbol><symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol><symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol><symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M5 12h14"/></symbol><symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></symbol><symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol><symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></symbol><symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol><symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></symbol><symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 2 18.3A2 2 0 0 0 3.7 21h16.6a2 2 0 0 0 1.7-2.7L13.7 3.9a2 2 0 0 0-3.4 0Z"/></symbol></svg><a class="skip" href="#conteudo">Pular para o conteúdo</a><header class="topbar"><div class="brand">Portal RH<small>Consulta e exportação de contratos</small></div><nav class="top-actions" aria-label="Navegação principal">{% if session.get('is_root') %}<a class="btn secondary" href="{{ url_for('auth.painel') }}"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>Painel ROOT</a>{% endif %}<form method="post" action="{{ url_for('auth.logout') }}"><button type="submit" class="logout"><svg class="icon" aria-hidden="true"><use href="#i-logout"></use></svg>Sair</button></form></nav></header><main id="conteudo" class="container"><section class="panel"><h1><svg class="icon" aria-hidden="true"><use href="#i-file"></use></svg> Contratos Determinados</h1><p>Selecione o período e o status para consultar ou exportar os registros.</p><form id="filters"><div class="grid"><div class="field"><label for="inicio">Data inicial</label><input type="date" name="inicio" id="inicio" required></div><div class="field"><label for="fim">Data final</label><input type="date" name="fim" id="fim" required></div><div class="field"><label for="status">Status de vencimento</label><select name="status" id="status"><option value="">Todos os contratos</option>{% for status in statuses %}<option value="{{ status }}">{{ status }}</option>{% endfor %}</select></div><div class="field"><label for="formato">Formato do arquivo</label><select name="formato" id="formato"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV (.csv)</option></select></div></div><p class="muted">O período considera a coluna {{ date_column }} (inclusive nas duas datas).</p><div class="actions"><button id="consultar" type="button" class="secondary"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg> Carregar/Consultar registros</button><button id="exportar" type="button"><svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg> Baixar relatório</button></div></form><p id="message" class="status-line" role="status" aria-live="polite"></p><div id="preview" class="scroll" role="region" aria-label="Prévia dos contratos" tabindex="0"></div></section></main><div id="routes" data-consultar="{{ url_for('contratos.consultar') }}" data-atualizar="{{ url_for('contratos.atualizar_dados') }}" data-exportar="{{ url_for('contratos.exportar') }}"></div><script>
function renderTable(dados, area) {area.replaceChildren();const cols=Array.isArray(dados.colunas)?dados.colunas:[];let rows=dados.registros;if(typeof rows==='string'){try{rows=JSON.parse(rows)}catch{throw new Error('Formato de dados inválido.')}}if(!Array.isArray(rows))throw new Error('Resposta de dados inválida.');if(!rows.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Nenhum registro encontrado.';area.appendChild(empty);return 0;}const table=document.createElement('table');const caption=document.createElement('caption');caption.textContent='Prévia dos registros consultados';caption.style.cssText='text-align:left;padding:12px;font-weight:700';table.appendChild(caption);const thead=document.createElement('thead');const tr=document.createElement('tr');for(const col of cols){const th=document.createElement('th');th.scope='col';th.textContent=col;tr.appendChild(th)}thead.appendChild(tr);table.appendChild(thead);const tbody=document.createElement('tbody');for(const row of rows){const tr=document.createElement('tr');for(const col of cols){const td=document.createElement('td');td.textContent=row[col]??'';tr.appendChild(td)}tbody.appendChild(tr)}table.appendChild(tbody);area.appendChild(table);return rows.length;}
const routes=document.getElementById('routes').dataset;const form=document.getElementById('filters');const msg=document.getElementById('message');const area=document.getElementById('preview');const consultarBtn=document.getElementById('consultar');const exportarBtn=document.getElementById('exportar');function params(){if(!form.reportValidity())return null;const inicio=form.elements.inicio.value;const fim=form.elements.fim.value;if(inicio>fim){msg.textContent='A data inicial não pode ser posterior à data final.';return null;}return new URLSearchParams(new FormData(form));}consultarBtn.addEventListener('click',async()=>{const p=params();if(!p)return;consultarBtn.disabled=true;msg.textContent='Atualizando dados do Oracle...';try{const atualizacao=await fetch(routes.atualizar,{method:'POST',credentials:'same-origin'});if(!atualizacao.ok){let detalhe='Falha na atualização (HTTP '+atualizacao.status+').';try{const erro=await atualizacao.json();detalhe=erro.erro||detalhe;}catch(_){}throw new Error(detalhe);}msg.textContent='Consultando registros atualizados...';const res=await fetch(routes.consultar+'?'+p.toString(),{credentials:'same-origin'});if(!res.ok)throw new Error('Não foi possível consultar os registros (HTTP '+res.status+').');const dados=await res.json();const total=renderTable(dados,area);msg.textContent=`Exibindo ${total} registro(s) na prévia (limite de 100).`;}catch(err){msg.textContent='Erro ao consultar: '+err.message;}finally{consultarBtn.disabled=false;}});exportarBtn.addEventListener('click',()=>{const p=params();if(!p)return;window.location.assign(routes.exportar+'?'+p.toString());msg.textContent='Solicitação de download enviada.';});
</script></body></html>
